<section id="simulator" class="sim-workbench" aria-labelledby="sim-title">
  <div class="sim-toolbar">
    <div class="sim-identity">
      <span class="sim-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5"/></svg>
      </span>
      <div class="sim-heading">
        <h2 id="sim-title">模拟训练</h2>
        <span id="sim-connection-state" class="sim-connection" data-connected="false">模拟魔方未连接</span>
      </div>
    </div>
    <div class="sim-main-actions">
      <button id="sim-connect" type="button" aria-label="连接模拟魔方">连接魔方</button>
      <button id="sim-check" class="sim-primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 10 7-10 7V5Z"/></svg>
        一键自检
      </button>
      <button id="sim-toggle-tools" class="sim-more" type="button" aria-expanded="false" aria-controls="sim-tools">
        更多操作
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  </div>
  <p id="sim-status" class="sim-feedback" data-state="idle" role="status">连接后可反复自检，约 15 秒完成。</p>
  <div id="sim-tools" class="sim-tools" hidden>
    <div class="sim-action-groups">
      <div class="sim-group">
        <h3>快速操作</h3>
        <div class="sim-action-row">
          <button id="sim-scramble" type="button">执行剩余打乱</button>
          <button id="sim-solve" type="button">逆序还原</button>
          <button id="sim-gyro" type="button">模拟姿态</button>
        </div>
      </div>
      <div class="sim-group">
        <h3>异常模拟</h3>
        <div class="sim-action-row">
          <button id="sim-hold" type="button">延迟回读</button>
          <button id="sim-release" type="button">释放回读</button>
          <button id="sim-disconnect" class="sim-disconnect" type="button">模拟断连</button>
        </div>
      </div>
    </div>
    <label class="sim-input-label" for="sim-moves">动作序列</label>
    <div class="sim-input-row">
      <input id="sim-moves" value="R U R'" placeholder="例如：R U R' U'" autocomplete="off" spellcheck="false" aria-describedby="sim-input-hint">
      <button id="sim-send" type="button">执行动作</button>
    </div>
    <p id="sim-input-hint" class="sim-helper">输入公式，检查魔方与训练流程。模拟成绩独立保存，刷新后重新连接即可。</p>
  </div>
</section>
